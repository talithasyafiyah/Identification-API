services:
  fastapi:
    build: .
    container_name: fastapi-app
    restart: always
    expose:
      - "8000"
    networks:
      - identification_api

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - identification_api

networks:
  identification_api:
